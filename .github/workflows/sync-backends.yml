name: Sync backends (Supabase ↔ GAS)

on:
  schedule:
    - cron: '0 */6 * * *'        # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print the plan, write nothing)'
        type: boolean
        default: true
      force:
        description: 'Allow large delete batches (normally refused)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write      # only used to report a failed scheduled run

# Never run two syncs at once.
concurrency:
  group: sync-backends
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test tests/sync.test.js

      - name: Sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAS_URL:              ${{ secrets.GAS_URL }}
          GAS_SYNC_KEY:         ${{ secrets.GAS_SYNC_KEY }}
          # Scheduled runs are live; manual runs default to dry-run.
          DRY_RUN:              ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force }}" = "true" ]; then ARGS="--force"; fi
          node scripts/sync.js $ARGS

      # Scheduled workflows fail silently otherwise. One open issue at a time (no spam every 6 h).
      - name: Report failed scheduled sync
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Scheduled backend sync failed in:title" --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Scheduled backend sync failed" \
              --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
